<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="workout">Bench Press</div>
    <div id="setinfo">__ - __ / __ - __ / __ - __</div>
    <div id="prompt">ENTER WEIGHT</div>
    <div id="promptinput">
        <grey>0</grey>
    </div>
    <div id="keypad">
        <div class="kpbtn" onclick="kpClick('1')">1</div>
        <div class="kpbtn" onclick="kpClick('2')">2</div>
        <div class="kpbtn" onclick="kpClick('3')">3</div>
        <div class="kpbtn" onclick="kpClick('4')">4</div>
        <div class="kpbtn" onclick="kpClick('5')">5</div>
        <div class="kpbtn" onclick="kpClick('6')">6</div>
        <div class="kpbtn" onclick="kpClick('7')">7</div>
        <div class="kpbtn" onclick="kpClick('8')">8</div>
        <div class="kpbtn" onclick="kpClick('9')">9</div>
        <div class="kpbtn" onclick="kpClick('back')">&lt;</div>
        <div class="kpbtn" onclick="kpClick('0')">0</div>
        <div class="kpbtn" onclick="kpClick('enter')">&gt;</div>
    </div>

    <script type="text/javascript" src="logger.js"></script>
</body>

</html>
